[defaults]
# --- 核心性能优化 ---
forks = 20
gathering = smart
# 默认使用 jsonfile 缓存
fact_caching = jsonfile
fact_caching_connection = ./.ansible_cache
fact_caching_timeout = 86400
# jinja2_native is now default in Ansible 2.12+, removed to avoid deprecation warning
var_compression_level = 9

# --- 性能策略 ---
strategy = mitogen_linear
#strategy = linear
local_tmp = /tmp/ansible-local
remote_tmp = /tmp

[mitogen]
# 使用 /tmp 作为临时目录 (postgres 可访问)
mitogen_local_temp_dir = /tmp/ansible-mitogen

# --- 路径与文件配置 ---
# These can be overridden by explicit ANSIBLE_* environment variables when needed.
collections_path = ./collections
vault_password_file = .vault_pass.txt
display_skipped_hosts = False
host_key_checking = False

# --- 输出格式优化 ---
deprecation_warnings=False
stdout_callback = default
bin_ansible_callbacks = True
callback_result_format = yaml
callback_format_pretty = True

# --- 回调插件 ---
any_errors_fatal = True

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=1800s -o ControlPath=/tmp/ansible-ssh-%h-%p-%r -o StrictHostKeyChecking=accept-new -o Compression=yes
scp_if_ssh = True
