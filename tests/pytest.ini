[pytest]
# AuroraOps Test Configuration (Ansible Runner 版本)
# =================================================

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output Configuration
addopts =
    -v
    --tb=short
    --strict-markers

# Markers
markers =
    integration: Integration tests (marks tests as integration tests)
    unit: Unit tests
    performance: Performance tests
    slow: Slow running tests
    role(name): Role-specific test
    phase(n): Phase-specific test

# Filter Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning

# Test Discovery
pythonpath = tests

# Parallel Execution (default)
# Override with: pytest -n auto
# -n auto: Use all CPU cores
# -n 2: Use 2 workers
# Set 0 or remove to disable parallel execution
