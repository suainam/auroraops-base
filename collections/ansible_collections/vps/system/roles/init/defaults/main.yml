---
init_fact_path: /etc/ansible/facts.d/init.fact

# 基础软件包列表
init_packages:
  - curl
  - git
  - vim
  - tree
  - rsync
  - htop
  - net-tools
  - lsof
  - python3
  - python3-apt
  - python3-pip
  - dnsutils  # Added for debugging (nslookup)
  - bash-completion

# ===========================================
# APT 镜像源配置映射
# ===========================================
# 根据 apt_mirror_provider 自动选择镜像源 URL
apt_mirror_urls:
  tsinghua: "https://mirrors.tuna.tsinghua.edu.cn/debian"
  ustc: "https://mirrors.ustc.edu.cn/debian"
  aliyun: "https://mirrors.aliyun.com/debian"
  tencent: "https://mirrors.cloud.tencent.com/debian"
  163: "https://mirrors.163.com/debian"
  huawei: "https://repo.huaweicloud.com/debian"

apt_security_urls:
  tsinghua: "https://mirrors.tuna.tsinghua.edu.cn/debian-security"
  ustc: "https://mirrors.ustc.edu.cn/debian-security"
  aliyun: "https://mirrors.aliyun.com/debian-security"
  tencent: "https://mirrors.cloud.tencent.com/debian-security"
  163: "https://mirrors.163.com/debian-security"
  huawei: "https://repo.huaweicloud.com/debian-security"

# 根据 apt_mirror_provider 变量设置实际 URL
apt_mirror_url: "{{ apt_mirror_urls[apt_mirror_provider] | default('http://deb.debian.org/debian') }}"
apt_security_url: "{{ apt_security_urls[apt_mirror_provider] | default('http://deb.debian.org/debian-security') }}"

# init 的 APT 选择采用防御式优先级：
# 1. 清华源
# 2. Debian 官方源
# 3. RTT 仅用于观测，不再推翻前两级优先级
init_effective_apt_mirror_url: "{{ apt_mirror_urls['tsinghua'] }}"
init_effective_apt_security_url: "{{ apt_security_urls['tsinghua'] }}"
init_fallback_apt_mirror_provider: official
init_fallback_apt_mirror_url: "http://deb.debian.org/debian"
init_fallback_apt_security_url: "http://deb.debian.org/debian-security"
init_bootstrap_nameservers:
  - 223.5.5.5
  - 1.1.1.1

# 是否在 init 阶段执行全量 dist-upgrade
# 默认关闭；init 先追求 APT 可用和最小依赖就绪
init_run_dist_upgrade: false
