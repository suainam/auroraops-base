# 启用控制变量: auroraops_roles['system']['init'] (定义在 group_vars/all/roles.yml 和 host_vars/)
# 默认: true (如需禁用，在 host_vars 中设置为 false)

- name: 角色启用检查
  ansible.builtin.debug:
    msg: "Role init is disabled, skipping"
  when: not (auroraops_roles['system']['init'] | default(true) | bool)
  tags: [always, deploy, system, init]

- name: 角色已启用，执行 Init 任务
  ansible.builtin.debug:
    msg: "Executing init role tasks"
  when: auroraops_roles['system']['init'] | default(true) | bool
  tags: [always, deploy, system, init]

- name: Run init preflight
  ansible.builtin.import_tasks: preflight.yml
  when: auroraops_roles['system']['init'] | default(true) | bool
  tags: [deploy, system, init, phase0]

- name: Apply managed init changes
  ansible.builtin.import_tasks: apply.yml
  when:
    - auroraops_roles['system']['init'] | default(true) | bool
    - not ansible_check_mode
  tags: [deploy, system, init, phase0]
