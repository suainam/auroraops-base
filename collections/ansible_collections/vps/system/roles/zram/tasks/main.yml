- name: 角色启用检查
  ansible.builtin.debug:
    msg: "Role zram is disabled, skipping"
  when: not (auroraops_roles['system']['zram'] | default(true) | bool)
  tags: [always, deploy, system, zram]

- name: 角色已启用，执行 ZRAM 任务
  ansible.builtin.debug:
    msg: "Executing zram role tasks"
  when: auroraops_roles['system']['zram'] | default(true) | bool
  tags: [always, deploy, system, zram]

- name: Run zram preflight
  ansible.builtin.import_tasks: preflight.yml
  when: auroraops_roles['system']['zram'] | default(true) | bool
  tags: [deploy, system, zram, phase0]

- name: Apply managed zram changes
  ansible.builtin.import_tasks: apply.yml
  when:
    - auroraops_roles['system']['zram'] | default(true) | bool
    - not ansible_check_mode
  tags: [deploy, system, zram, phase0]
