# roles/system-security/firewall/handlers/main.yml
---
- name: Reload ufw
  become: yes
  community.general.ufw:
    state: reloaded
  notify: Restart docker
  when: not ansible_check_mode  # 在 check 模式下跳过

- name: Restart ufw
  become: yes
  ansible.builtin.service:
    name: ufw
    state: restarted
  notify: Restart docker
  when: not ansible_check_mode  # 在 check 模式下跳过

- name: Restart docker
  become: yes
  ansible.builtin.shell: |
    if systemctl is-active --quiet docker 2>/dev/null; then
      echo "Restarting docker service..."
      systemctl restart docker
    else
      echo "Docker not running or not installed, skipping restart"
    fi
  ignore_errors: yes
  # Avoid repeated restarts in a single run that trip systemd StartLimitBurst (#191).
  # If docker_reconcile.yml already rebuilt chains and restarted Docker, skip handler.
  when:
    - not ansible_check_mode
    - not (firewall_docker_restarted_in_run | default(false) | bool)
