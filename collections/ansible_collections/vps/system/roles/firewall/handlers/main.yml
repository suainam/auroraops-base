# roles/system-security/firewall/handlers/main.yml
---
- name: Reload ufw
  become: yes
  community.general.ufw:
    state: reloaded
  notify: Restart docker
  when: not ansible_check_mode  # 在 check 模式下跳过

- name: Restart ufw
  become: yes
  ansible.builtin.service:
    name: ufw
    state: restarted
  notify: Restart docker
  when: not ansible_check_mode  # 在 check 模式下跳过

- name: Restart docker
  become: yes
  ansible.builtin.shell: |
    if systemctl is-active --quiet docker 2>/dev/null; then
      echo "Restarting docker service..."
      systemctl restart docker
    else
      echo "Docker not running or not installed, skipping restart"
    fi
  ignore_errors: yes
  # Deliberately not gated on docker_service_installed. That variable belongs to
  # the docker role and a firewall run on its own never sets it, so
  # `| default(false)` skipped this handler -- leaving "nft flush ruleset" with
  # nothing to restore the rules it had just destroyed. The role was only
  # self-consistent when the docker role happened to run first in the same play,
  # which is a hidden inter-role dependency sitting on top of a destructive step.
  # Docker's own presence is detected in the command above instead, and that
  # check needs no variable from another role.
  when: not ansible_check_mode
