---
- name: Check which kernel modules are available
  check_mode: false
  ansible.builtin.shell: "modinfo {{ item }} >/dev/null 2>&1"
  loop: "{{ sysctl_managed_modules }}"
  register: sysctl_module_check
  changed_when: false
  failed_when: false
  tags: [deploy, verify, system, sysctl, phase0]

- name: Gather currently loaded kernel modules
  check_mode: false
  ansible.builtin.command: lsmod
  register: sysctl_lsmod
  changed_when: false
  tags: [deploy, verify, system, sysctl, phase0]

- name: Parse module availability and loaded state
  ansible.builtin.set_fact:
    sysctl_available_modules: "{{ sysctl_module_check.results | selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"
    sysctl_loaded_modules_before: >-
      {{
        sysctl_lsmod.stdout_lines[1:] | default([])
        | map('split')
        | map('first')
        | list
      }}
  tags: [deploy, verify, system, sysctl, phase0]

- name: Query registered kernel congestion control algorithms
  check_mode: false
  ansible.builtin.command: sysctl -n net.ipv4.tcp_available_congestion_control
  register: sysctl__current_avail_cc
  changed_when: false
  failed_when: false
  tags: [deploy, verify, system, sysctl, phase0]

- name: Query active kernel congestion control algorithm
  check_mode: false
  ansible.builtin.command: sysctl -n net.ipv4.tcp_congestion_control
  register: sysctl__current_active_cc
  changed_when: false
  failed_when: false
  tags: [deploy, verify, system, sysctl, phase0]

- name: Parse congestion control capability facts
  ansible.builtin.set_fact:
    sysctl_registered_cc_algorithms: "{{ (sysctl__current_avail_cc.stdout | default('')).split() }}"
    sysctl_active_cc_algorithm: "{{ (sysctl__current_active_cc.stdout | default('')).strip() }}"
  tags: [deploy, verify, system, sysctl, phase0]

- name: Determine congestion control resolution
  ansible.builtin.set_fact:
    sysctl_bbr_supported: "{{ 'bbr' in sysctl_registered_cc_algorithms }}"
    sysctl_explicit_cc_supported: "{{ sysctl_tcp_congestion_control in sysctl_registered_cc_algorithms }}"
  tags: [deploy, verify, system, sysctl, phase0]

- name: Resolve effective congestion control algorithm
  ansible.builtin.set_fact:
    sysctl_resolved_cc: >-
      {{
        'bbr'
        if (sysctl_tcp_congestion_control == 'auto' and (sysctl_bbr_supported | bool))
        else (
          sysctl_tcp_congestion_control
          if sysctl_tcp_congestion_control != 'auto'
          else sysctl_active_cc_algorithm
        )
      }}
  tags: [deploy, verify, system, sysctl, phase0]

- name: Determine managed modules to persist
  ansible.builtin.set_fact:
    sysctl_modules_to_persist: >-
      {{
        (
          ['nf_conntrack'] if ('nf_conntrack' in sysctl_available_modules) else []
        )
        +
        (
          ['tcp_bbr'] if (sysctl_resolved_cc == 'bbr' and 'tcp_bbr' in sysctl_available_modules) else []
        )
        +
        (
          ['tcp_bbr2'] if (sysctl_resolved_cc == 'bbr2' and 'tcp_bbr2' in sysctl_available_modules) else []
        )
      }}
  tags: [deploy, verify, system, sysctl, phase0]

- name: Select sysctl base parameter set
  ansible.builtin.set_fact:
    sysctl_selected_params: >-
      {{
        {}
        if (sysctl_replace_default_params | default(false) | bool)
        else sysctl_params
      }}
  tags: [deploy, verify, system, sysctl, phase0]

- name: Combine default and custom sysctl params
  ansible.builtin.set_fact:
    sysctl_final_sysctl_params: "{{ sysctl_selected_params | combine(sysctl_custom_params | default({})) }}"
  tags: [deploy, verify, system, sysctl, phase0]

- name: Apply resolved congestion control algorithm
  ansible.builtin.set_fact:
    sysctl_final_sysctl_params: >-
      {{
        sysctl_final_sysctl_params
        | combine({'net.ipv4.tcp_congestion_control': sysctl_resolved_cc})
      }}
  when:
    - sysctl_resolved_cc is defined
    - (sysctl_resolved_cc | string | length) > 0
  tags: [deploy, verify, system, sysctl, phase0]

- name: Apply Virt-specific Hardening
  ansible.builtin.set_fact:
    sysctl_final_sysctl_params: >-
      {{
        sysctl_final_sysctl_params
        | combine(
            sysctl_hardening_baremetal
            if (
              performance.hardware.virt_type | default('') == 'baremetal'
              or ansible_local.performance.hardware.virt_type
              | default('') == 'baremetal'
            )
            else sysctl_hardening_kvm
          )
      }}
  when:
    - performance.hardware.virt_type | default(ansible_local.performance.hardware.virt_type | default('')) != ''
  tags: [deploy, verify, system, sysctl, phase0]

- name: Calculate Dynamic BDP Buffers for high_bdp profile
  ansible.builtin.set_fact:
    sysctl__benchmark_latency: "{{ performance.network.latency_ms | default(ansible_local.performance.network.latency_ms | default(0)) }}"
  when: sysctl_network_profile == 'high_bdp'
  tags: [deploy, verify, system, sysctl, phase0]

- name: Validate high_bdp profile inputs
  ansible.builtin.fail:
    msg: >-
      sysctl_network_profile 'high_bdp' requires positive values for
      sysctl_target_bandwidth_mbps (>0), latency (>0ms), sysctl_bdp_headroom (>0),
      and sysctl_max_buffer_bytes (>= 87380).
      Current: bandwidth={{ sysctl_target_bandwidth_mbps | default('undefined') }},
      latency={{ sysctl__benchmark_latency | default('undefined') }},
      headroom={{ sysctl_bdp_headroom | default('undefined') }},
      max_buffer={{ sysctl_max_buffer_bytes | default('undefined') }}.
  when:
    - sysctl_network_profile == 'high_bdp'
    - (
        (sysctl__benchmark_latency | default(0) | float) <= 0
        or (sysctl_target_bandwidth_mbps | default(0) | float) <= 0
        or (sysctl_bdp_headroom | default(0) | float) <= 0
        or (sysctl_max_buffer_bytes | default(0) | int) < 87380
      )
  tags: [deploy, verify, system, sysctl, phase0]

- name: Apply Dynamic BDP Buffers (high_bdp Profile Only)
  ansible.builtin.set_fact:
    sysctl_dynamic_max_buffer: >-
      {{
        [
          [
            (
              (sysctl_target_bandwidth_mbps | float * 125000)
              * ((sysctl__benchmark_latency | float) / 1000)
              * (sysctl_bdp_headroom | float)
            ) | int,
            87380
          ] | max,
          (sysctl_max_buffer_bytes | int)
        ] | min
      }}
  when:
    - sysctl_network_profile == 'high_bdp'
    - (sysctl__benchmark_latency | default(0) | float) > 0
    - (sysctl_target_bandwidth_mbps | default(0) | float) > 0
    - (sysctl_bdp_headroom | default(0) | float) > 0
    - (sysctl_max_buffer_bytes | default(0) | int) >= 87380
  tags: [deploy, verify, system, sysctl, phase0]

- name: Assemble Dynamic BDP sysctl params
  ansible.builtin.set_fact:
    sysctl_final_sysctl_params: >-
      {{
        sysctl_final_sysctl_params
        | combine(
            {
              'net.ipv4.tcp_rmem': '4096 87380 ' ~ (sysctl_dynamic_max_buffer | string),
              'net.ipv4.tcp_wmem': '4096 65536 ' ~ (sysctl_dynamic_max_buffer | string),
              'net.core.rmem_max': (sysctl_dynamic_max_buffer | int),
              'net.core.wmem_max': (sysctl_dynamic_max_buffer | int)
            }
          )
      }}
  when: sysctl_dynamic_max_buffer is defined
  tags: [deploy, verify, system, sysctl, phase0]

- name: Check which sysctl keys exist on target
  ansible.builtin.stat:
    path: "/proc/sys/{{ item.key | replace('.', '/') }}"
  loop: "{{ sysctl_final_sysctl_params | dict2items }}"
  register: sysctl_key_stats
  tags: [deploy, verify, system, sysctl, phase0]

- name: Filter unsupported sysctl keys
  ansible.builtin.set_fact:
    sysctl_final_sysctl_params: >-
      {{
        dict(
          sysctl_key_stats.results
          | selectattr('stat.exists', 'defined')
          | selectattr('stat.exists')
          | map(attribute='item')
          | map(attribute='key')
          | zip(
              sysctl_key_stats.results
              | selectattr('stat.exists', 'defined')
              | selectattr('stat.exists')
              | map(attribute='item')
              | map(attribute='value')
            )
        )
      }}
    sysctl_unsupported_sysctl_keys: >-
      {{
        sysctl_key_stats.results
        | rejectattr('stat.exists', 'defined')
        | map(attribute='item.key')
        | list
        +
        (
          sysctl_key_stats.results
          | selectattr('stat.exists', 'defined')
          | rejectattr('stat.exists')
          | map(attribute='item.key')
          | list
        )
      }}
  tags: [deploy, verify, system, sysctl, phase0]

- name: Debug unsupported sysctl keys
  ansible.builtin.debug:
    msg: "Skipping unsupported sysctl keys: {{ sysctl_unsupported_sysctl_keys | join(', ') }}"
  when: (sysctl_unsupported_sysctl_keys | default([])) | length > 0
  tags: [deploy, verify, system, sysctl, phase0]
