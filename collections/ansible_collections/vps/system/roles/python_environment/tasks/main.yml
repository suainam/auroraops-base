- name: 角色启用检查
  ansible.builtin.debug:
    msg: "Role python_environment is disabled, skipping"
  when: not (auroraops_roles['system']['python_environment'] | default(true) | bool)
  tags: [always, deploy, system, python_environment]

- name: 角色已启用，执行 Python 环境任务
  ansible.builtin.debug:
    msg: "Executing python_environment role tasks"
  when: auroraops_roles['system']['python_environment'] | default(true) | bool
  tags: [always, deploy, system, python_environment]

- name: Run python_environment preflight
  ansible.builtin.import_tasks: preflight.yml
  when: auroraops_roles['system']['python_environment'] | default(true) | bool
  tags: [deploy, system, python_environment, phase1]

- name: Apply managed python_environment changes
  ansible.builtin.import_tasks: apply.yml
  when:
    - auroraops_roles['system']['python_environment'] | default(true) | bool
    - not ansible_check_mode
  tags: [deploy, system, python_environment, phase1]
