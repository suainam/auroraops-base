---
base_fact_path: /etc/ansible/facts.d/base.fact
system_timezone: Asia/Shanghai
system_locale: en_US.UTF-8

# NTP 优选列表 (Debian Pool)
ntp_servers:
  - 0.debian.pool.ntp.org
  - 1.debian.pool.ntp.org
  - 2.debian.pool.ntp.org
  - 3.debian.pool.ntp.org

# DNS 解析服务器列表 (混合 Google + Cloudflare + APNIC)
dns_servers:
  - 8.8.8.8  # Google
  - 1.1.1.1  # Cloudflare
  - 8.8.4.4  # Google
  - 1.0.0.1  # Cloudflare

# HandlePowerKey policy (systemd-logind). Empty = leave the distribution default
# untouched. Set to 'ignore' on hosts whose virtualization/console layer emits
# spurious ACPI power-key events that would otherwise shut the server down
# (cc15 incident). When set, it is applied to both HandlePowerKey and
# HandlePowerKeyLongPress via a drop-in under /etc/systemd/logind.conf.d.
base_logind_handle_power_key: ""
