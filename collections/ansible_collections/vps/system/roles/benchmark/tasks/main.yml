- name: 角色启用检查
  ansible.builtin.debug:
    msg: Role benchmark is disabled, skipping
  when: not (auroraops_roles['system']['benchmark'] | default(true) | bool)
  tags:
  - always
  - deploy
  - system
  - benchmark
- name: 角色已启用，执行 Benchmark 任务
  ansible.builtin.debug:
    msg: Executing benchmark role tasks
  when: auroraops_roles['system']['benchmark'] | default(true) | bool
  tags:
  - always
  - deploy
  - system
  - benchmark

- name: Run benchmark preflight
  ansible.builtin.import_tasks: preflight.yml
  when: auroraops_roles['system']['benchmark'] | default(true) | bool
  tags:
  - deploy
  - system
  - benchmark
  - phase0

- name: Apply managed benchmark changes
  ansible.builtin.import_tasks: apply.yml
  when:
  - auroraops_roles['system']['benchmark'] | default(true) | bool
  - not ansible_check_mode
  tags:
  - deploy
  - system
  - benchmark
  - phase0
