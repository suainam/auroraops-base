- name: Check existing logrotate baseline
  become: true
  ansible.builtin.stat:
    path: "{{ logrotate_fact_path }}"
  register: logrotate_fact_stat
  tags: [deploy, system, logrotate, phase1]

- name: Read existing logrotate baseline
  become: true
  ansible.builtin.slurp:
    path: "{{ logrotate_fact_path }}"
  register: logrotate_fact_raw
  when: logrotate_fact_stat.stat.exists
  tags: [deploy, system, logrotate, phase1]

- name: Parse existing logrotate baseline
  ansible.builtin.set_fact:
    logrotate_baseline: "{{ logrotate_fact_raw.content | b64decode | from_json }}"
  when: logrotate_fact_stat.stat.exists
  tags: [deploy, system, logrotate, phase1]

- name: Validate logrotate baseline metadata
  ansible.builtin.assert:
    that:
      - logrotate_baseline.auroraops_managed | default(false) | bool
      - logrotate_baseline.version | default(0) | int >= 1
      - logrotate_baseline.managed_file == logrotate_managed_file
      - logrotate_baseline.managed_dir == logrotate_managed_dir
      - logrotate_baseline.pre_deploy_main_content is defined
      - logrotate_baseline.service_configs is defined
    fail_msg: "Existing logrotate baseline is invalid"
  when: logrotate_fact_stat.stat.exists
  tags: [deploy, system, logrotate, phase1]

- name: Check current logrotate main file state
  become: true
  ansible.builtin.stat:
    path: "{{ logrotate_managed_file }}"
  register: logrotate_main_stat
  tags: [deploy, system, logrotate, phase1]

- name: Read current logrotate main file
  become: true
  ansible.builtin.slurp:
    path: "{{ logrotate_managed_file }}"
  register: logrotate_main_raw
  when: logrotate_main_stat.stat.exists
  tags: [deploy, system, logrotate, phase1]

- name: Build desired service config names
  ansible.builtin.set_fact:
    logrotate_service_config_names: "{{ (logrotate_configs_to_deploy | default([])) | map(attribute='name') | list }}"
  tags: [deploy, system, logrotate, phase1]

- name: Read current service-specific logrotate files
  become: true
  ansible.builtin.slurp:
    path: "{{ logrotate_managed_dir }}/{{ item }}"
  loop: "{{ logrotate_service_config_names }}"
  loop_control:
    label: "{{ item }}"
  register: logrotate_service_config_raw
  failed_when: false
  tags: [deploy, system, logrotate, phase1]

- name: Build service config baseline map
  ansible.builtin.set_fact:
    logrotate_service_config_baseline: "{{ logrotate_service_config_baseline | default({}) | combine({item.item: {'exists': item.failed is not defined or not item.failed, 'content': ((item.content | b64decode) if (item.failed is not defined or not item.failed) else '')}}) }}"
  loop: "{{ logrotate_service_config_raw.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  tags: [deploy, system, logrotate, phase1]

- name: Build desired logrotate main lines
  ansible.builtin.set_fact:
    logrotate_desired_rotate_line: "rotate {{ logrotate_rotate_count }}"
    logrotate_desired_compress_line: "{{ 'compress' if logrotate_enable_compress else '# compress disabled by AuroraOps' }}"
  tags: [deploy, system, logrotate, phase1]

- name: Debug logrotate decision
  ansible.builtin.debug:
    msg: "ManagedFile={{ logrotate_managed_file }} BaselineExists={{ logrotate_fact_stat.stat.exists }} CheckMode={{ ansible_check_mode }} ServiceConfigs={{ logrotate_service_config_names | join(',') }}"
  tags: [deploy, system, logrotate, phase1]
