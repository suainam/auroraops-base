- name: Check logrotate baseline presence for rollback
  become: true
  ansible.builtin.stat:
    path: "{{ logrotate_fact_path }}"
  register: logrotate_fact_stat
  tags: [rollback, system, logrotate, phase1]

- name: Check logrotate main file presence for rollback
  become: true
  ansible.builtin.stat:
    path: "{{ logrotate_managed_file }}"
  register: logrotate_main_stat
  tags: [rollback, system, logrotate, phase1]

- name: Refuse rollback without baseline when logrotate artifacts remain
  ansible.builtin.fail:
    msg: "Logrotate baseline is missing while managed logrotate artifacts still exist"
  when:
    - not logrotate_fact_stat.stat.exists
    - logrotate_main_stat.stat.exists | default(false)
  tags: [rollback, system, logrotate, phase1]

- name: No managed logrotate state to rollback
  ansible.builtin.debug:
    msg: "No logrotate baseline found, skipping rollback"
  when:
    - not logrotate_fact_stat.stat.exists
  tags: [rollback, system, logrotate, phase1]

- name: Read logrotate baseline for rollback
  become: true
  ansible.builtin.slurp:
    path: "{{ logrotate_fact_path }}"
  register: logrotate_fact_raw
  when: logrotate_fact_stat.stat.exists
  tags: [rollback, system, logrotate, phase1]

- name: Parse logrotate baseline for rollback
  ansible.builtin.set_fact:
    logrotate_baseline: "{{ logrotate_fact_raw.content | b64decode | from_json }}"
  when: logrotate_fact_stat.stat.exists
  tags: [rollback, system, logrotate, phase1]

- name: Validate logrotate baseline for rollback
  ansible.builtin.assert:
    that:
      - logrotate_baseline.auroraops_managed | default(false) | bool
      - logrotate_baseline.version | default(0) | int >= 1
      - logrotate_baseline.managed_file == logrotate_managed_file
      - logrotate_baseline.managed_dir == logrotate_managed_dir
      - logrotate_baseline.pre_deploy_main_content is defined
      - logrotate_baseline.service_configs is defined
    fail_msg: "Logrotate baseline content is invalid for rollback"
  when: logrotate_fact_stat.stat.exists
  tags: [rollback, system, logrotate, phase1]

- name: Restore previous logrotate main file content
  become: true
  ansible.builtin.copy:
    dest: "{{ logrotate_managed_file }}"
    content: "{{ logrotate_baseline.pre_deploy_main_content }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - logrotate_fact_stat.stat.exists
    - logrotate_baseline.pre_deploy_main_exists | bool
  notify: Force logrotate
  tags: [rollback, system, logrotate, phase1, logrotate_restore_main]

- name: Remove service config files absent before deploy
  become: true
  ansible.builtin.file:
    path: "{{ logrotate_managed_dir }}/{{ item.key }}"
    state: absent
  loop: "{{ (logrotate_baseline.service_configs | default({})) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - logrotate_fact_stat.stat.exists
    - not (item.value.exists | default(false))
  notify: Force logrotate
  tags: [rollback, system, logrotate, phase1, logrotate_remove_service_configs]

- name: Restore service config files present before deploy
  become: true
  ansible.builtin.copy:
    dest: "{{ logrotate_managed_dir }}/{{ item.key }}"
    content: "{{ item.value.content }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ (logrotate_baseline.service_configs | default({})) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - logrotate_fact_stat.stat.exists
    - item.value.exists | default(false)
  notify: Force logrotate
  tags: [rollback, system, logrotate, phase1, logrotate_restore_service_configs]

- name: Remove logrotate baseline after successful rollback
  become: true
  ansible.builtin.file:
    path: "{{ logrotate_fact_path }}"
    state: absent
  when: logrotate_fact_stat.stat.exists
  tags: [rollback, system, logrotate, phase1, logrotate_remove_baseline]
