  # 启用控制变量: auroraops_roles['system']['limits'] (定义在 group_vars/all/roles.yml 和 host_vars/)
  # 默认: true (如需禁用，在 host_vars 中设置为 false)

  - name: 角色启用检查
    ansible.builtin.debug:
      msg: "Role limits is disabled, skipping"
    when: not (auroraops_roles['system']['limits'] | default(true) | bool)
    tags: [always, deploy, system, limits]

  - name: 角色已启用，执行 Limits 任务
    ansible.builtin.debug:
      msg: "Executing limits role tasks"
    when: auroraops_roles['system']['limits'] | default(true) | bool
    tags: [always, deploy, system, limits]

  - name: Run limits preflight
    ansible.builtin.import_tasks: preflight.yml
    when: auroraops_roles['system']['limits'] | default(true) | bool
    tags: [deploy, system, limits, phase0]

  - name: Apply managed limits changes
    ansible.builtin.import_tasks: apply.yml
    when:
      - auroraops_roles['system']['limits'] | default(true) | bool
      - not ansible_check_mode
    tags: [deploy, system, limits, phase0]
